<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1a1a1a;
    }

    .calc {
      background-color: #222;
      padding: 20px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      height: 50px;
      font-size: 20px;
      text-align: right;
      margin-bottom: 10px;
      padding: 5px;
      box-sizing: border-box;
      background-color: #111;
      color: #fff;
      border: 1px solid #444;
    }

    button {
      width: 60px;
      height: 50px;
      font-size: 18px;
      margin: 3px;
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="calc">
    <input type="text" id="display" readonly />

    <div>
      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button onclick="adicionar('/')" style="background-color:#ff8c00">÷</button><br>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button onclick="adicionar('*')" style="background-color:#ff8c00">×</button><br>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button onclick="adicionar('-')" style="background-color:#ff8c00">−</button><br>

      <button onclick="adicionar('0')">0</button>
      <button onclick="adicionar('.')">.</button>
      <button onclick="calcular()" style="background-color:#ff8c00">=</button>
      <button onclick="adicionar('+')" style="background-color:#ff8c00">+</button><br>

      <button onclick="limpar()">C</button>
    </div>
  </div>

  <script>
    function adicionar(v) {
      document.getElementById('display').value += v;
    }
    function calcular() {
      var d = document.getElementById('display');
      try { d.value = eval(d.value); }
      catch (e) { d.value = 'Erro'; }
    }
    function limpar() {
      document.getElementById('display').value = '';
    }
  </script>

</body>
</html>
