<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Paginação</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    ul.paginacao {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 6px;
    }

    ul.paginacao li a {
      text-decoration: none;
      color: #0077b6;
      border: 1px solid #0077b6;
      padding: 6px 12px;
      border-radius: 4px;
      display: inline-block;
    }

    ul.paginacao li a:hover {
      background-color: #0077b6;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <ul class="paginacao">
    <li><a href="#">«</a></li>
    <li><a href="#">1</a></li>
    <li><a href="#">2</a></li>
    <li><a href="#">3</a></li>
    <li><a href="#">»</a></li>
  </ul>

</body>
</html>
